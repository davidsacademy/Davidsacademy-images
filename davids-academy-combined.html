<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>David's Academy of Defensive Driving</title>
</head>
<body>

<button onclick="document.getElementById('g1pop').style.display='flex'"
style="background:linear-gradient(135deg,#CC0000,#990000);color:#fff;
border:none;border-radius:14px;padding:16px 32px;font-size:16px;
font-weight:800;cursor:pointer;font-family:sans-serif;">
🚗 G1 Test Preparation
</button>

<div id="g1pop" style="display:none;position:fixed;inset:0;
background:rgba(0,0,0,0.7);z-index:9999;
align-items:flex-start;justify-content:center;
padding-top:env(safe-area-inset-top,0px);
overflow-y:auto;">
  <div style="width:min(98vw,720px);
  height:calc(100vh - env(safe-area-inset-top,0px));
  max-height:100vh;
  background:#fff;
  border-radius:0 0 22px 22px;
  display:flex;flex-direction:column;
  margin-top:env(safe-area-inset-top,0px);">
    <div style="background:#CC0000;padding:10px 16px;flex-shrink:0;
    display:flex;justify-content:space-between;align-items:center;">
      <span style="color:#fff;font-weight:800;font-family:sans-serif;font-size:15px;">
        🚦 G1 Test Prep — David's Academy
      </span>
      <button onclick="document.getElementById('g1pop').style.display='none'"
      style="background:rgba(255,255,255,0.2);border:none;color:#fff;
      width:32px;height:32px;border-radius:50%;cursor:pointer;
      font-size:18px;font-weight:900;line-height:1;">✕</button>
    </div>
    <iframe src="https://davidsacademy.github.io/index.html/"
    style="flex:1;border:none;width:100%;"
    title="G1 Test Prep">
    </iframe>
  </div>
</div>

</body>
</html>
