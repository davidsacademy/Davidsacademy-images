<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700;800&family=Inter:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;margin:0;padding:0;background:transparent;}
header{
  width:100%;
  background:#000;
  border-bottom:3px solid #C8102E;
  display:flex;
  align-items:stretch;   /* stretch so logo fills full header height */
  padding:0 14px 0 0;
  gap:14px;
  overflow:hidden;
}
/* Logo fills full header height — top aligns with David's, bottom with email */
.logo{
  object-fit:contain;
  display:block;
  flex-shrink:0;
  width:clamp(80px,15vw,130px);
  /* no fixed height — stretches to match header height naturally */
}
.bt{
  display:flex;flex-direction:column;justify-content:center;
  gap:3px;min-width:0;flex:1;
  padding:8px 0;
}
.b1{
  font-family:'Oswald',sans-serif;
  font-size:clamp(0.95rem,3.8vw,1.75rem);
  font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;color:#fff;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.b2{
  font-family:'Oswald',sans-serif;
  font-size:clamp(0.55rem,1.6vw,0.82rem);
  font-weight:700;letter-spacing:2.5px;
  text-transform:uppercase;color:#F5C518;line-height:1.1;
  white-space:nowrap;
}
.bcontact{display:flex;flex-direction:column;gap:2px;margin-top:3px;}
.bphone,.bemail{
  font-family:'Inter',sans-serif;
  font-size:clamp(0.58rem,1.4vw,0.8rem);
  font-weight:700;color:#fff;white-space:nowrap;letter-spacing:0.3px;
}
.bphone::before{content:'📞 ';}
.bemail::before{content:'✉ ';}
.wrap{width:100%;overflow:hidden;line-height:0;}
.track{display:flex;width:800vw;will-change:transform;}
.slide{flex-shrink:0;width:100vw;}
.si{display:block;width:100%;height:auto;}
</style>
</head>

<script>
const REAL=6,TOTAL=REAL+2,AUTO=4000,SPEED=400;
const track=document.getElementById('track');
let cur=1,autoT,sliding=false;
function setPos(i,a){track.style.transition=a?`transform ${SPEED}ms cubic-bezier(0.55,0,0.1,1)`:'none';track.style.transform=`translateX(-${i*100}vw)`;cur=i;}
function goTo(i){if(sliding)return;sliding=true;setPos(i,true);}
track.addEventListener('transitionend',()=>{sliding=false;if(cur===0)setPos(REAL,false);else if(cur===REAL+1)setPos(1,false);});
function next(){goTo(cur+1);}function prev(){goTo(cur-1);}
function startAuto(){clearInterval(autoT);autoT=setInterval(next,AUTO);}
document.getElementById('wrap').addEventListener('click',e=>{if(e.clientX>window.innerWidth/2)next();else prev();clearInterval(autoT);startAuto();});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){next();clearInterval(autoT);startAuto();}if(e.key==='ArrowLeft'){prev();clearInterval(autoT);startAuto();}});
let tx=0;
track.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
track.addEventListener('touchend',e=>{const d=tx-e.changedTouches[0].clientX;if(Math.abs(d)>45){if(d>0)next();else prev();clearInterval(autoT);startAuto();}});
setPos(1,false);startAuto();
</script>
