<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Slider</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;margin:0;padding:0;background:transparent;overflow:hidden;}
.wrap{width:100%;overflow:hidden;line-height:0;}
.track{display:flex;width:800vw;will-change:transform;}
.slide{flex-shrink:0;width:100vw;}
.si{display:block;width:100%;height:auto;}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="track" id="track">
  <div class="slide"><img class="si" src="https://raw.githubusercontent.com/davidsacademy/Davidsacademy-images/main/file_000000002b0c71fdace2022dcf1ffc03.png" alt="clone-last"/></div>
  <div class="slide"><img class="si" src="https://raw.githubusercontent.com/davidsacademy/Davidsacademy-images/main/file_00000000200c722f991655b77cb49ed7.png" alt="Smith's System Overview"/></div>
  <div class="slide"><img class="si" src="https://raw.githubusercontent.com/davidsacademy/Davidsacademy-images/main/file_0000000045e871f58328406455b66d3a.png" alt="Aim High in Steering"/></div>
  <div class="slide"><img class="si" src="https://raw.githubusercontent.com/davidsacademy/Davidsacademy-images/main/file_000000004c44722f9535bf14d3d250c1.png" alt="Get the Big Picture"/></div>
  <div class="slide"><img class="si" src="https://raw.githubusercontent.com/davidsacademy/Davidsacademy-images/main/file_0000000055d471f89616cc5ab7787302.png" alt="Keep Your Eyes Moving"/></div>
  <div class="slide"><img class="si" src="https://raw.githubusercontent.com/davidsacademy/Davidsacademy-images/main/file_00000000600471f5b4edcef5f12b02be.png" alt="Leave Yourself an Out"/></div>
  <div class="slide"><img class="si" src="https://raw.githubusercontent.com/davidsacademy/Davidsacademy-images/main/file_000000002b0c71fdace2022dcf1ffc03.png" alt="Make Sure They See You"/></div>
  <div class="slide"><img class="si" src="https://raw.githubusercontent.com/davidsacademy/Davidsacademy-images/main/file_00000000200c722f991655b77cb49ed7.png" alt="clone-first"/></div>

  </div>
</div>
<script>
const REAL=6,TOTAL=REAL+2,AUTO=4000,SPEED=400;
const track=document.getElementById('track');
let cur=1,autoT,sliding=false;
function setPos(i,a){
  track.style.transition=a?`transform ${SPEED}ms cubic-bezier(0.55,0,0.1,1)`:'none';
  track.style.transform=`translateX(-${i*100}vw)`;cur=i;
}
function goTo(i){if(sliding)return;sliding=true;setPos(i,true);}
track.addEventListener('transitionend',()=>{
  sliding=false;
  if(cur===0)setPos(REAL,false);
  else if(cur===REAL+1)setPos(1,false);
});
function next(){goTo(cur+1);}
function prev(){goTo(cur-1);}
function startAuto(){clearInterval(autoT);autoT=setInterval(next,AUTO);}
document.getElementById('wrap').addEventListener('click',e=>{
  if(e.clientX>window.innerWidth/2)next();else prev();
  clearInterval(autoT);startAuto();
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){next();clearInterval(autoT);startAuto();}
  if(e.key==='ArrowLeft'){prev();clearInterval(autoT);startAuto();}
});
let tx=0;
track.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
track.addEventListener('touchend',e=>{
  const d=tx-e.changedTouches[0].clientX;
  if(Math.abs(d)>45){if(d>0)next();else prev();clearInterval(autoT);startAuto();}
});
setPos(1,false);startAuto();
</script>
</body>
</html>
