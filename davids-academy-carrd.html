<script>
const REAL=6,TOTAL=REAL+2,AUTO=4000,SPEED=400;
const track=document.getElementById('track');
track.style.width=(TOTAL*100)+'vw';
let cur=1,autoT,sliding=false;
function setPos(i,a){track.style.transition=a?`transform ${SPEED}ms cubic-bezier(0.55,0,0.1,1)`:'none';track.style.transform=`translateX(-${i*100}vw)`;cur=i;}
function goTo(i){if(sliding)return;sliding=true;setPos(i,true);}
track.addEventListener('transitionend',()=>{sliding=false;if(cur===0)setPos(REAL,false);else if(cur===REAL+1)setPos(1,false);});
function next(){goTo(cur+1);}function prev(){goTo(cur-1);}
function startAuto(){clearInterval(autoT);autoT=setInterval(next,AUTO);}
document.getElementById('vp').addEventListener('click',e=>{if(e.clientX>window.innerWidth/2)next();else prev();clearInterval(autoT);startAuto();});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){next();clearInterval(autoT);startAuto();}if(e.key==='ArrowLeft'){prev();clearInterval(autoT);startAuto();}});
let tx=0;
track.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
track.addEventListener('touchend',e=>{const d=tx-e.changedTouches[0].clientX;if(Math.abs(d)>45){if(d>0)next();else prev();clearInterval(autoT);startAuto();}});
setPos(1,false);startAuto();
</script>
